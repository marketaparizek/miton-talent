<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miton talent</title>
  <style>
    /* Miton brand font, served same-origin (no Google Fonts, no third-party calls). */
    @font-face {
      font-family: "DegularDisplay";
      src: url("/fonts/DegularDisplay-Regular.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "DegularDisplay";
      src: url("/fonts/DegularDisplay-Medium.woff2") format("woff2");
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: "DegularDisplay";
      src: url("/fonts/DegularDisplay-Semibold.woff2") format("woff2");
      font-weight: 600;
      font-display: swap;
    }
    html, body { height: 100%; margin: 0; background: transparent; }
    #miton-talent-chat { height: 100%; }
  </style>
</head>
<body>
  <div id="miton-talent-chat" data-backend="" data-lang="cs" data-height="100%"></div>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var el = document.getElementById("miton-talent-chat");
      var lang = p.get("lang") || p.get("locale");
      if (lang === "en") el.dataset.lang = "en";
      if (p.get("resize") === "1") {
        el.dataset.height = "auto";
        document.documentElement.style.height = "auto";
        document.body.style.height = "auto";
        el.style.height = "auto";
      }
    })();
  </script>
  <script src="/widget.js"></script>
</body>
</html>
