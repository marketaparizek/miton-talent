let ac = null;
function beep(f, d = 0.08, type = 'square', slide = 0) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.linearRampToValueAtTime(f + slide, ac.currentTime + d);
    g.gain.value = 0.05; g.gain.linearRampToValueAtTime(0, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
// background tune: an original eight-bit loop
const LEAD = [76, 0, 79, 76, 72, 0, 74, 76, 77, 0, 81, 77, 74, 0, 76, 77, 79, 0, 76, 79, 84, 0, 83, 81, 79, 76, 74, 0, 72, 0, 0, 0];
const BASS = [48, 55, 48, 55, 53, 60, 53, 60, 48, 55, 52, 55, 55, 50, 55, 0];
const music = { on: true, timer: null, i: 0 };
function tone(midi, d, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
  g.gain.value = vol; g.gain.setValueAtTime(vol, ac.currentTime + d * 0.7); g.gain.linearRampToValueAtTime(0, ac.currentTime + d);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
}
function musicStart() {
  if (music.timer || !music.on) return;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.resume) ac.resume();
  } catch (e) { return; }
  music.timer = setInterval(() => {
    try {
      if (ac.state !== 'running') return;
      const l = LEAD[music.i % LEAD.length];
      if (l) tone(l, 0.17, 'square', 0.022);
      if (music.i % 2 === 0) { const b = BASS[(music.i / 2) % BASS.length]; if (b) tone(b, 0.34, 'triangle', 0.06); }
      music.i++;
    } catch (e) {}
  }, 190);
}

const MAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ' ': 'jump', ArrowUp: 'jump', w: 'jump', W: 'jump' };
addEventListener('keydown', e => {

  if (e.repeat) return;
  if (dlgOpen) {
    if (dlgPick && /^[1-9]$/.test(e.key)) {
      const i = +e.key - 1;

  }
  if (e.key === 'm' || e.key === 'M') return musicToggle();

/* ---------- update ---------- */
function onTop() { return p.x >= (BAR0 + 9) * T - 4 && p.x < (BAR0 + 12) * T && p.y < 6 * T; }
function step() {
  state.tick++;
  bumps = bumps.filter(b => --b.t > 0);
  parts = parts.filter(k => --k.t > 0);
  if (dlgOpen) { setCap(''); return; }
  if (!state.finished) state.time += 1 / 60;

  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir) { p.vx += dir * 0.25; p.face = dir; } else p.vx *= 0.75;
  p.vx = Math.max(-SPEED, Math.min(SPEED, p.vx));
  if (Math.abs(p.vx) < 0.05) p.vx = 0;

  coyote = p.onGround ? 6 : Math.max(0, coyote - 1);
  jumpBuf = Math.max(0, jumpBuf - 1);
  if (jumpBuf && coyote) { p.vy = JUMP; jumpBuf = 0; coyote = 0; beep(440, 0.1, 'square', 300); }
  if (!keys.jump && p.vy < -2) p.vy = -2;
  p.vy = Math.min(6, p.vy + GRAV);

  p.x += p.vx;
  if (collides(p.x, p.y)) {
    if (p.vx > 0) p.x = Math.floor((p.x + PW - 0.01) / T) * T - PW;
    else p.x = Math.floor(p.x / T) * T + T;
    p.vx = 0;
  }
  p.y += p.vy; p.onGround = false;
  if (collides(p.x, p.y)) {
    if (p.vy > 0) { p.y = Math.floor((p.y + PH - 0.01) / T) * T - PH; p.onGround = true; }
    else { headBump(); p.y = Math.floor(p.y / T) * T + T; }
    p.vy = 0;
  }
  if (p.onGround && p.vx) p.anim += Math.abs(p.vx) * 0.12;

  // the AI companion follows once quest 1 has started
  if (state.ctxStarted) {
    bot.x += (p.x - 14 * p.face - bot.x) * 0.08;
    bot.y += (p.y - 8 - bot.y) * 0.08;
  }

  // triggers
  if (!st('vojta').done && p.x > (NPCX.vojta - 2.5) * T) complete('vojta');
  else if (!st('martin').done && p.x > (NPCX.martin - 2.5) * T) complete('martin');
  else if (!state.ctxStarted && p.x > (NPCX.shopper - 2.5) * T) startContext();
  if (state.ctxStarted && !dlgOpen) pieces.forEach((k, i) => { if (!k.got && !dlgOpen && p.x + PW > k.x && p.x < k.x + 12) takePiece(i); });
  if (!dlgOpen && !st('review').done && p.x > (TERM - 1.5) * T && p.x < (TERM + 2.5) * T) openReview();
  if (!dlgOpen && !st('marketa').done && p.x > (NPCX.marketa - 2.5) * T) complete('marketa');

  // caption
  if (state.toastT > 0) { state.toastT--; setCap(state.toast); }
  else if (!st('sync').done && p.x > 37 * T && p.x < GATES.sync * T) setCap(CONTENT.sync.hint);
  else if (!st('own').done && p.x > (BAR0 - 3) * T && p.x < GATES.own * T) setCap(onTop() ? CONTENT.own.hintAlarm : CONTENT.own.hintClimb);
  else setCap('');

  state.cam = Math.round(Math.max(0, Math.min(COLS * T - W, p.x - W * 0.4)));
}
function headBump() {
  const r = Math.floor(p.y / T);
  const cc = Math.floor((p.x + PW / 2) / T);
  const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + PW - 0.01) / T);
  for (const c of [cc, c0, c1]) {
    const ch = tileAt(c, r);
    if (ch === 'B') { grid[r][c] = 'b'; bumps.push({ c, r, t: 10 }); syncHit(c); return; }
    if (ch === 'A') { bumps.push({ c, r, t: 10 }); alarmHit(); return; }
  }
  beep(150, 0.05);
}

function drawTile(ch, c, r, x, y) {

    const top = tileAt(c, r - 1) !== '#';
    R(x, y, T, T, '#17141f');
    if (top) { R(x, y, T, 3, VIO); R(x, y + 3, T, 1, '#4c1d95'); }
    R(x + ((c * 5 + r * 3) % 12), y + 7, 2, 2, '#2a2538');
    R(x + ((c * 7 + r) % 11), y + 12, 2, 1, '#2a2538');
  } else if (ch === 'B' || ch === 'b') {
    const live = ch === 'B';
    const glow = live && Math.floor(state.tick / 20) % 2 === 0;
    R(x, y + oy, T, T, live ? '#4c1d95' : '#c9c6d6');
    R(x + 1, y + 1 + oy, 14, 14, live ? (glow ? '#8b5cf6' : VIO) : '#e9e7f1');
    R(x + 1, y + 1 + oy, 14, 1, live ? '#c4b5fd' : '#ffffff'); R(x + 1, y + 1 + oy, 1, 14, live ? '#c4b5fd' : '#ffffff');
    if (live) drawMask(M_SYM, x + 8 - (M_SYM[0].length >> 1), y + 3 + oy, '#fff');
    else { R(x + 4, y + 8 + oy, 2, 2, VIO); R(x + 6, y + 10 + oy, 2, 2, VIO); R(x + 8, y + 8 + oy, 2, 2, VIO); R(x + 10, y + 6 + oy, 2, 2, VIO); }
  } else if (ch === 'A' || ch === 'a') {
    const live = ch === 'A', on = live && Math.floor(state.tick / 10) % 2 === 0;
    for (let cy = 0; cy < y; cy += 4) R(x + 7, cy, 2, 2, INK);
    R(x, y + oy, T, T, INK);
    R(x + 1, y + 1 + oy, 14, 14, live ? (on ? RED : '#fca5a5') : '#e9e7f1');
    if (on) { R(x + 6, y + 18, 4, 2, RED); R(x + 7, y + 22, 2, 2, RED); }
    if (live) { R(x + 7, y + 3 + oy, 2, 6, '#fff'); R(x + 7, y + 11 + oy, 2, 2, '#fff'); }
    else { R(x + 4, y + 8 + oy, 2, 2, VIO); R(x + 6, y + 10 + oy, 2, 2, VIO); R(x + 8, y + 8 + oy, 2, 2, VIO); R(x + 10, y + 6 + oy, 2, 2, VIO); }
  } else if (ch === 'G') {
    R(x + 4, y, 8, T, INK);
    const o = (r % 2) * 4;
    R(x + 5, y + o, 6, 4, '#a78bfa'); R(x + 5, y + o + 8, 6, 4, '#a78bfa');
  } else if (ch === 'S') {
    const k = (c - BAR0) % 3;
    R(x, y, T, T, BARCOL[Math.floor((c - BAR0) / 3)]);
    if (tileAt(c, r - 1) !== 'S') R(x, y, T, 2, INK);
    if (k === 0) R(x, y, 1, T, INK); else if (k === 2) R(x + 15, y, 1, T, INK);
  }
}

// people: A has a ponytail (Markéta), N does not
const A0 = ['...hhhhhh...', '..hhhhhhhh..', '.hhhhsssss..', '.hhhsssese..', 'hhh.ssssss..', 'hh...ssss...', 'h..jjjjjj...', '..jjjjjjjj..', '..jjjwjjjjs.', '..sjjjjjj...', '...jjjjjj...', '...pppppp...', '...pp..pp...', '...pp..pp...', '...pp..pp...', '..bbb..bbb..'];
const A1 = A0.slice(0, 8).concat(['.sjjjwjjjj..', '...jjjjjjs..', '...jjjjjj...', '...pppppp...', '..ppp.ppp...', '.pp....pp...', '.pp....ppp..', '.bb.....bbb.']);
const noTail = s => s.map((row, i) => i === 4 ? '....ssssss..' : i === 5 ? '.....ssss...' : i === 6 ? '...jjjjjj...' : row);
const N0 = noTail(A0), N1 = noTail(A1);
// the shopper is a shopping cart with eyes
const C0 = ['............', '............', '............', '............', '............', 'k...........', 'kk..........', '.kkkkkkkkkkk', '.kvvvvvvvvvk', '.kvwkvvwkvvk', '.kvvvvvvvvk.', '..kvvvvvvvk.', '..kkkkkkkk..', '...k....k...', '..kkk..kkk..', '..kkk..kkk..'];
const BASE = { h: '#2a1a12', s: '#f2c09a', e: INK, j: VIO, w: '#ffffff', p: INK, b: '#4c1d95' };
const LOOK = {
  hero: BASE,
  vojta: { ...BASE, j: INK, h: '#5a3a1e', p: '#3b3651', b: INK },
  martin: { ...BASE, j: '#c9c6d6', h: '#17141f', w: VIO, b: INK },
  shopper: { k: INK, v: '#f59e0b', w: '#ffffff' },
  marketa: { ...BASE, h: '#3b2314', j: '#19c2b0', p: '#2b2f5b', b: INK }
};
function drawPerson(spr, pal, x, y, faceRight) {
  for (let r = 0; r < 16; r++) for (let c = 0; c < 12; c++) {
    const ch = spr[r][c]; if (ch !== '.') R(x - 2 + (faceRight ? c : 11 - c), y - 1 + r, 1, 1, pal[ch]);
  }
}
function drawNpc(id, label, spr, cam, alert) {
  const x = NPCX[id] * T - cam; if (x < -40 || x > W + 40) return;
  const y = GY - (Math.floor(state.tick / 30 + NPCX[id]) % 2);
  drawPerson(spr, LOOK[id], x, y, false);
  text(label, x + 4, y - 12, VIO, 6, 'center');
  if (alert && Math.floor(state.tick / 20) % 2) { R(x + 3, y - 26, 2, 6, INK); R(x + 3, y - 18, 2, 2, INK); }
}
function drawBot(cam) {
  const x = Math.round(bot.x) - cam, y = Math.round(bot.y + Math.sin(state.tick / 12) * 2) - 4;
  R(x + 6, y - 3, 1, 3, INK); R(x + 5, y - 5, 3, 2, VIO);
  R(x, y, 13, 14, INK); R(x + 1, y + 1, 11, 12, VIO); R(x + 1, y + 1, 11, 1, '#a78bfa');
  drawMask(M_SYM, x + 7 - (M_SYM[0].length >> 1), y + 2, '#fff');
  if (!state.ctxStarted) text('AI', x + 7, y - 15, VIO, 6, 'center');
}

function drawProps(cam) {
  // shop signs with the pixel wordmark
  for (const col of [1, 89]) {
    const w = M_WORD[0].length + 12, x = col * T - cam, y = 92;
    if (x > W || x + w < 0) continue;
    R(x + 6, y + 20, 2, 48, INK); R(x + w - 8, y + 20, 2, 48, INK);
    R(x, y, w, 25, INK); R(x + 1, y + 1, w - 2, 23, '#fff');
    drawMask(M_WORD, x + 6, y + 5, INK);
  }
  // quest 1: context pieces
  pieces.forEach((k, i) => {
    if (k.got) return;
    const x = k.x - cam, y = 140 + Math.round(Math.sin(state.tick / 14 + k.x) * 2);
    R(x - 1, y - 1, 12, 12, INK); R(x, y, 10, 10, i === 0 ? '#c4b5fd' : i === 1 ? '#fde68a' : '#a7f3d0');
    R(x + 2, y + 2, 6, 1, INK); R(x + 2, y + 5, 6, 1, INK); R(x + 2, y + 8, 4, 1, INK);
    text(CONTENT.context.pieces[i].label, x + 5, y - 12, INK, 6, 'center');
  });
  // quest 2: platform labels
  SYNC.forEach((c, i) => text(CONTENT.sync.platforms[i], c * T + 8 - cam, 5 * T - 4, grid[6][c] === 'B' ? INK : '#a8a4b8', 6, 'center'));
  for (const k of parts) {
    const x = k.x - cam, y = k.y - (45 - k.t) * 0.8;
    R(x, y, 10, 12, '#fff'); O(x, y, 10, 12, INK); R(x + 2, y + 2, 6, 5, '#c4b5fd'); R(x + 2, y + 9, 4, 1, INK);
  }
  // quest 3: review terminal
  {
    const x = TERM * T - cam, y = 160 - 28, done = st('review').done;
    R(x + 5, y + 16, 6, 12, INK); R(x - 2, y, 20, 17, INK); R(x - 1, y + 1, 18, 15, done ? '#e9e7f1' : '#17141f');
    if (!done) { R(x + 1, y + 4, 8, 1, '#a78bfa'); R(x + 1, y + 7, 12, 1, RED); R(x + 1, y + 10, 6, 1, '#a78bfa'); }
    text('REVIEW', x + 8, y - 12, INK, 6, 'center');
  }
}
function drawBarLabels(cam) {
  CONTENT.own.bars.forEach((b, i) => {
    const cx = (BAR0 + 3 * i) * T + 24 - cam, top = (9 - i) * T;
    ctx.font = '6px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = i > 1 ? '#fff' : INK; ctx.fillText(b, cx, top + 5);
  });
}

function draw() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  const cam = state.cam;
  drawBg(cam);
  const c0 = Math.floor(cam / T), c1 = Math.min(COLS - 1, c0 + Math.ceil(W / T) + 1);
  drawProps(cam);
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    const ch = grid[r][c]; if (ch !== '.') drawTile(ch, c, r, c * T - cam, r * T);
  }
  drawBarLabels(cam);
  drawNpc('vojta', CONTENT.vojta.label, N0, cam, !st('vojta').done);
  drawNpc('martin', CONTENT.martin.label, N0, cam, !st('martin').done);
  drawNpc('shopper', CONTENT.context.label, C0, cam, !state.ctxStarted);
  drawNpc('marketa', CONTENT.marketa.label, A0, cam, !st('marketa').done);
  drawBot(cam);
  const moving = !p.onGround || (Math.abs(p.vx) > 0.2 && Math.floor(p.anim) % 2);
  drawPerson(moving ? N1 : N0, LOOK.hero, Math.round(p.x) - cam, Math.round(p.y), p.face > 0);
  if (!st('own').done && onTop() && Math.floor(state.tick / 10) % 2) { R(0, 0, W, 3, RED); R(0, H - 3, W, 3, RED); R(0, 0, 3, H, RED); R(W - 3, 0, 3, H, RED); }

  const q = stations.filter(s => s.quest);
  text('QUESTS ' + q.filter(s => s.done).length + '/' + q.length, 8, 8);
  if (state.ctxStarted && !st('context').done) text(CONTENT.context.hud + ' ' + pieces.filter(k => k.got).length + '/3', W / 2, 8, VIO, 8, 'center');
  else if (state.sync > 0 && !st('sync').done) text(CONTENT.sync.hud + ' ' + state.sync + '/3', W / 2, 8, VIO, 8, 'center');
  text('TIME ' + fmt(state.time), W - 8, 8, INK, 8, 'right');
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= 1 / 60) { step(); acc -= 1 / 60; }
  draw();
  requestAnimationFrame(frame);
}
// one page view per load for the traffic analytics (Alister admin -> Traffic):
// the pathname, where they came from, utm_source, and a per-tab visit id.
// No cookie, nothing else about the visitor.
(function () {
  try {
    let visit = null;
    try {
      visit = sessionStorage.getItem('al_visit');
      if (!visit) { visit = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem('al_visit', visit); }
    } catch (e) {}
    const json = JSON.stringify({
      path: location.pathname,
      referrer: document.referrer || null,
      utm_source: new URLSearchParams(location.search).get('utm_source'),
      session_id: visit
    });
    fetch('/api/pageview', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: json, keepalive: true }).catch(() => {});
  } catch (e) {}
})();

init();
musicFirst(); // plays at once where the browser allows sound without a click
requestAnimationFrame(frame);
</script>
</body>
