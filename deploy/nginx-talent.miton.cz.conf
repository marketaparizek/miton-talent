# Template; setup_server.sh replaces __DOMAIN__ with DOMAIN from .env
# (default talent.miton.cz; talent.alisterai.com works as an interim name).
#
# First install: setup_server.sh installs it, `nginx -t && systemctl reload nginx`, then
#   certbot --nginx -d talent.miton.cz
# certbot rewrites the file with the TLS block and the 80 -> 443 redirect.
#
# The chat widget is embedded on miton.cz in an iframe; the backend sets the
# frame-ancestors CSP itself, so nginx must not add X-Frame-Options here.
#
# Security headers (same three as Alister's snippets/security-headers.conf in
# github-sourcing deploy/nginx/). certbot copies them into the 443 block it
# writes. A location with an add_header of its own would drop these; keep
# locations free of add_header or repeat the three lines there.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12m;   # CV upload is capped at 8 MB in the app, base64 adds a third

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # the model call inside /chat can take a while
    }
}
